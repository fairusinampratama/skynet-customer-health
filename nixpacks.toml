# Nixpacks Configuration for Skynet Customer Health
# Updated: Node 22 for Vite 7+, supervisor via pip --break-system-packages

[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "php84Extensions.pdo_mysql",
    "php84Extensions.bcmath",
    "php84Extensions.sockets",
    "php84Extensions.xml",
    "php84Extensions.mbstring",
    "php84Extensions.ctype",
    "php84Extensions.curl",
    "php84Extensions.dom",
    "php84Extensions.fileinfo",
    "php84Extensions.filter",
    "php84Extensions.tokenizer",
    "php84Extensions.pcntl",
    "php84Extensions.posix",
    "php84Extensions.intl",
    "php84Extensions.zip",
    "php84Extensions.gd",
    "php84Extensions.redis",
    "nodejs_22",
    "python311",
    "python311Packages.pip",
    "iputils"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm install",
    "pip install --break-system-packages supervisor"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "sh deploy.sh && supervisord -c supervisord.conf"
